name: Bug 报告
description: 报告可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请勿在此提交，请按 SECURITY.md 私下报告。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 上传……
        2. 打开……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、部署方式（Docker / systemd / 离线包）、Python 版本、GPU 型号
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请先脱敏（账号、密钥、会议内容）
      render: text
