<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}会议纪要{% endblock %}</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#F7F7F8; --surface-2:#EFEFF2;
    --text:#171717; --muted:#52525B; --border:rgba(23,23,23,.12);
    --brand:#02743B; --brand-soft:#E5FFF2; --warn:#B45309; --danger:#B42318;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.7 -apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  .top{border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:9}
  .top-inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
  .brand{font-weight:600;font-size:16px;letter-spacing:.2px}
  .hint{color:var(--muted);font-size:12px;white-space:nowrap}
  main{padding:28px 20px 80px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .card + .card{margin-top:16px}
  h1{font-size:24px;line-height:1.4;margin:0 0 8px;font-weight:600}
  h2{font-size:16px;margin:0 0 12px;font-weight:600}
  .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:14px}
  .pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;
        border:1px solid var(--border);color:var(--muted);background:#fff}
  .pill.done{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
  .pill.working{color:var(--warn);border-color:#F5D0A9;background:#FFF8EE}
  .pill.failed{color:var(--danger);border-color:#F3B5B0;background:#FEF3F2}
  ul{margin:0;padding-left:18px}
  li{margin:4px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:12px}
  tr:last-child td{border-bottom:none}
  .empty{color:var(--muted);font-size:13px}
  .banner{padding:14px 16px;border-radius:var(--radius);background:#FFF8EE;
          border:1px solid #F5D0A9;color:var(--warn);font-size:13px;margin-bottom:16px}
  .banner.failed{background:#FEF3F2;border-color:#F3B5B0;color:var(--danger)}
  .quote{color:var(--muted);font-size:12px;border-left:2px solid var(--border);
         padding-left:10px;margin-top:6px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
  .seg{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border)}
  .seg:last-child{border-bottom:none}
  .seg .who{color:var(--brand);font-size:12px;min-width:56px;flex:none}
  .seg .at{color:var(--muted);font-size:12px;min-width:42px;flex:none}
  .rel{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
  .rel:last-child{border-bottom:none}
  .rel .tag{flex:none;font-size:12px;color:var(--brand);background:var(--brand-soft);
            border:1px solid var(--border);border-radius:999px;padding:0 8px}
  .btn{display:inline-block;padding:6px 14px;border-radius:8px;border:1px solid var(--border);
       background:#fff;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .note{color:var(--muted);font-size:12px;margin-top:18px}
  .rowlink{display:flex;justify-content:space-between;gap:16px;padding:14px 0;
           border-bottom:1px solid var(--border);align-items:center}
  .rowlink:last-child{border-bottom:none}
  .rowlink:hover .rt{color:var(--brand)}
  .rt{font-weight:500}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
  input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--border);
        border-radius:8px;font-size:14px;margin:8px 0 16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="/">会议记忆</a>
    <span class="hint">录音 → 纪要 → 归档</span>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
