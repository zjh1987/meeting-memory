<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}会议记忆{% endblock %}</title>
  {% include "_style.html" %}
</head>
<body>
{% if not standalone %}
<div class="topbar">
  <div class="wrap">
    <a class="brand" href="/">会议记忆</a>
    <nav class="nav">
      <a href="/" data-tip="查看全部会议与上传录音">会议列表</a>
      <a href="/admin" data-tip="配置模型、热词、模板与会议管理">管理后台</a>
      <a href="/site/index.html" target="_blank"
         data-tip="只读 HTML 归档，可分享或长期保存">静态归档</a>
      <form method="post" action="/logout" style="display:inline">
        <button class="btn ghost small" type="submit"
                data-tip="清除登录状态">退出</button>
      </form>
    </nav>
  </div>
</div>
{% endif %}
<div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
