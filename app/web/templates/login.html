{% extends "base.html" %}
{% block title %}登录 · 会议记忆{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>会议记忆</h1>
    <p class="muted">录音自动转写 · 结构化纪要 · 跨会议关联</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" autofocus required
               value="{{ username or 'admin' }}" placeholder="登录账号">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required
               placeholder="请输入密码">
      </div>
      <button class="btn" type="submit" style="width:100%"
              data-tip="进入会议记忆">进入</button>
    </form>
    <p class="muted" style="margin-bottom:0">首次使用的默认管理员账号为 admin，密码取 APP_PASSWORD。</p>
  </div>
</div>
{% endblock %}
